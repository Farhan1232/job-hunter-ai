name: Job Hunter

on:
  schedule:
    # Every 60 minutes — adjust as needed (cron is in UTC)
    - cron: "0 * * * *"
  workflow_dispatch:  # lets you trigger manually from GitHub UI

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: job-hunter
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore seen-jobs DB
        uses: actions/cache@v4
        with:
          path: data/seen_jobs.db
          key: seen-jobs-${{ github.run_id }}
          restore-keys: |
            seen-jobs-

      - name: Run job hunter
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          ADZUNA_APP_ID:      ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY:     ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY:     ${{ secrets.JOOBLE_API_KEY }}
        run: python -m src.main
